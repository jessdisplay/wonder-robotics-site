<!-- Wonder Robotics for Noodle Box, the running order (build.py, noodle_box_source). Jesse, 28 Oct 2026, evening: the
     USC information deck is the model ("I'm worried we overcooked this"); "everything on this deck relates to the robot
     stir-fry machines"; no prices; then "others we have done look so good", "give us a story", and "give us the god
     level treatment, it would be around the Noodle Box branding". So it is built as the Fonzie Abbott posters deck was:
     one poster a page, their pages in Noodle Box's own world (their red, black and cream, their words, their real
     badge and wordmark), ours in our purple. The story: the wok is the heart of their promise in every store; our
     robot keeps that promise, wok-charred, in their red; one store, the busiest stores, then a dark kitchen; who
     makes it; then the close every deck has (rule, 22 Oct). The posters are made by Drive
     wonder-noodle-box/tools/nb_posters.py (the posters deck's own poster.py); the founders poster is the posters
     deck's own (fonzie-abbott/deck/posters/pictures/ours/w1-team.jpg); the close card is close.jpg. A "take" marker
     below is that slide of the information deck, word for word. -->

<style>
  /* The opener (Jesse, 28 Oct 2026: "Wonder Robotics for Concept Eight on either side, so that's it, the opener"): the
     film plays between the two marks, ours on the left, theirs on the right, nothing else. The machine stands right of
     centre in the film (x 41 to 78 percent), so their mark sits in the strip beyond it. Blocks are placed by their box,
     never by transform: the deck's rising lines (.r) animate transform. */
  .in.full.open.loop::after{background:linear-gradient(to right,rgba(19,10,36,.66) 0%,rgba(19,10,36,0) 38%),
    linear-gradient(to left,rgba(19,10,36,.6) 0%,rgba(19,10,36,0) 24%),
    linear-gradient(to bottom,rgba(19,10,36,.5) 0%,rgba(19,10,36,0) 16%)}
  .open-c,.open-r{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;z-index:2}
  .open-c{left:calc(96*var(--u));width:calc(500*var(--u))}
  .open-r{right:calc(96*var(--u));width:calc(370*var(--u));flex-direction:row;align-items:center;gap:calc(26*var(--u))}
  .open-r img{display:block;width:calc(290*var(--u));height:auto}
  .open-r .x{font-weight:300;font-size:calc(64*var(--u));line-height:1;color:var(--paper)}
  /* "x Concept Eight" comes in as the machine becomes theirs, and goes as the film fades back to the empty stage */
  .open.cued .open-r{opacity:0;transition:opacity .9s ease}
  .open.cued .open-r.on{opacity:1}
  @media print,(prefers-reduced-motion:reduce){.open.cued .open-r{opacity:1}}   /* no film: both marks, still */
  .open-mark{margin:0}
  .open-mark canvas{display:block;width:100% !important;height:auto !important}   /* the drawn mark, sized by its box */
  /* The opener's film plays by itself (Jesse, 28 Oct 2026: "I don't want a timer like this"). No scroll, so it works
     with the arrows, in full screen, on a phone and behind the passcode. */
  .loop-film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--night)}
  .loop .still-only{display:none}
  @media print{ .loop-film{display:none} .loop .still-only{display:block} }
  /* The posters carry their own words; the small print stays small and quiet, so the poster carries the page */
  .foot{font-size:calc(16*var(--u));opacity:.62}
  .in.full.poster.foot-ink .foot{color:rgba(32,16,58,.66)}                       /* on their cream */
  @media screen and (max-width:760px),screen and (max-height:440px){   /* the deck's own phone rule: screen only, never the PDF */
    .open-c,.open-r{position:relative;left:auto;right:auto}
    .open-c{width:62%;margin:26px 22px 0} .open-r{width:36%;margin:22px 22px 44px}
    .loop-film{position:relative;inset:auto;aspect-ratio:16/9;height:auto}
    .in.full.loop::after{display:none}
    .in.full.poster .plate{aspect-ratio:16/9}                                     /* a poster is never cropped: its words are in it */
  }
</style>

<!-- running order -->
<!-- 1. The opener plays by itself (Jesse, 28 Oct 2026: "animated starting blank"; "the original one was best"; "use
     the same idea you used to go from paper to metal to go from metal to branded red"; "no stirring until in the
     restaurant"; "keep it clean and minimal"): the build film from the empty stage and the drawing to the steel machine
     under our mark; a white light sweeps across it, as the paper-to-steel sweep does, and behind it the machine is
     theirs, with "x Concept Eight" coming in at that moment; clean and still, then the film's own way into their
     white-tiled shop, where it starts cooking. cover-machine.mp4 is the build film through Drive
     wonder-noodle-box/tools/opener_frames.py and make_loop.py reveal; data-at is the second it becomes theirs
     (opener_frames.py prints it). Concept Eight's mark, in white. It starts past the drawing (Jesse, 29 Oct 2026, of
     the sketch: "for the intro remove this one", "the sketch, start with the machine"; of this deck too: "Yes, both
     intros"): make_loop.py reveal on the opener's frames from f034, the first steel frame clear of the sweep's light,
     so the empty stage gives way to the steel machine; everything after is the same film, 34 frames sooner (data-at
     6.08 - 34/24 = 4.66). The Concept Eight deck opens on the same film. -->
<section class="stage" id="s{{i}}" aria-label="Slide {{i}}. Wonder Robotics for Noodle Box">
  <div class="slide night"><div class="in full open loop cued">
    <video class="loop-film" src="{{root}}img/deck/noodle-box/cover-machine.mp4" muted playsinline loop preload="auto" aria-hidden="true"></video>
    <div class="plate still-only"><img src="{{root}}img/deck/noodle-box/build-5.jpg" width="2752" height="1536" alt="Our robot wok in Noodle Box red, standing alone in our purple studio" style="--op:72% 50%"></div>
    <div class="open-c">
      <h1 class="open-mark r"><canvas id="open-mark" data-wonder-mark data-sub="ROBOTICS" data-ink="#F3F1E4" data-w="960" data-pxr="0.2" data-hr="0.34" role="img" aria-label="Wonder Robotics"></canvas></h1>
    </div>
    <div class="open-r" data-at="4.66" data-out="1.1"><span class="x" aria-hidden="true">&times;</span><img src="{{root}}img/deck/noodle-box/c8-white.png" width="1200" height="487" alt="Concept Eight"></div>
    <div class="foot"><p>Concept</p><p>{{n}}</p></div>
  </div></div>
  <script>
  // The robot pops into the moon, as on the website (Jesse, 27 Oct 2026: "when we scroll get the robotics head to pop
  // into the moon too like the website"): the cover's mark whenever the cover comes on screen, the header's the first
  // time you move on, as the mark hands over to the bar. The site's own WonderSneak, loaded at the foot of the deck.
  window.addEventListener("load", function () {
    var big = document.getElementById("open-mark"), head = document.getElementById("bar-canvas"), cover = big && big.closest(".stage");
    if (!cover || !window.WonderSneak || !window.IntersectionObserver) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    function peek(cv, ms) { if (cv && WonderSneak.park(cv)) setTimeout(function () { WonderSneak.run(cv, ms); }, 140); }
    var on = false, handed = false;
    function watch() {
      new IntersectionObserver(function (es) {
        var now = es[0].isIntersecting;
        if (now && !on) peek(big, 1100);
        if (!now && on && !handed) { handed = true; peek(head, 950); }
        on = now;
      }, { threshold: 0.55 }).observe(cover);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(watch); else watch();   // the mark needs its face drawn first
  });
  // The film plays while it is on screen and stops when it leaves; reduced motion keeps the still.
  window.addEventListener("load", function () {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (!("IntersectionObserver" in window)) return;
    [].forEach.call(document.querySelectorAll(".loop video"), function (v) {
      v.addEventListener("playing", function () { v.classList.add("live"); });   // the deck shows a video once it plays
      // a mark that comes in at a moment of the film (the opener's "x Concept Eight"): on from data-at seconds, off
      // data-out seconds before the end, as the film fades back to the empty stage
      var box = v.closest(".in"), cued = box && box.querySelectorAll("[data-at]");
      if (cued && cued.length) {
        v.addEventListener("timeupdate", function () {
          [].forEach.call(cued, function (el) {
            var t = v.currentTime, d = v.duration || 0;
            el.classList.toggle("on", t >= +el.dataset.at && (!d || t < d - +el.dataset.out));
          });
        });
      }
      new IntersectionObserver(function (es) {
        if (es[0].isIntersecting) {
          if (v.preload !== "auto") { v.preload = "auto"; v.load(); }
          var go = v.play(); if (go && go.catch) go.catch(function () {});
        } else v.pause();
      }, { threshold: 0.35 }).observe(v.closest(".stage"));
    });
  });
  </script>
</section>
