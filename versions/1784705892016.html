<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Wonder Robotics Site",
  "schemaVersion": 1,
  "description": "Wonder Robotics feature landing page. WebGL throughout: dancing purple-visor 'Byte' robot hero (Three.js GLB with baked dance animation), animated crescent-moon logo mark in the corner, and a drifting purple-polyhedra night-sky background with a starfield. Includes feature grid, stats, and CTA. Robot GLB loads from Higgsfield; falls back to a still render if the host blocks cross-origin.",
  "mcpTools": [],
  "mcpServerNames": []
}
</script>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wonder Robotics — Byte</title>
<style>
  :root{
    --bg0:#07060d; --bg1:#0f0b1c; --purple:#b9a3ff; --deep:#6b4f9e; --txt:#f1edfb; --sub:#9d92bd;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg0);color:var(--txt);overflow:hidden;position:relative;
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  /* soft moon glow washing the top */
  .topwash{position:fixed;top:-32vh;left:50%;transform:translateX(-50%);
    width:120vw;height:70vh;z-index:1;pointer-events:none;
    background:radial-gradient(50% 60% at 50% 40%, rgba(150,120,230,.42), rgba(90,70,150,.14) 45%, transparent 70%);
    filter:blur(8px);}
  .vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 30%, transparent 55%, rgba(4,3,10,.75) 100%);}

  /* background canvas (stars only, very subtle) */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;
    background:radial-gradient(130% 100% at 50% -10%, #1a1330 0%, #0f0b1c 42%, #07060d 100%);}

  /* robot canvas */
  #robot{position:fixed;inset:0;width:100%;height:100%;z-index:3;}
  #robotFallback{position:fixed;inset:0;z-index:3;display:none;align-items:center;justify-content:center;}
  #robotFallback img{max-height:78vh;filter:drop-shadow(0 40px 60px rgba(0,0,0,.6));}

  /* crescent moon */
  #moon{position:fixed;top:5vh;left:50%;transform:translateX(-50%);width:112px;height:112px;z-index:5;
    filter:drop-shadow(0 0 34px rgba(170,140,255,.75));
    animation:breathe 9s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translateX(-50%) translateY(0);opacity:.94;}
    50%{transform:translateX(-50%) translateY(7px);opacity:1;}}
  @media (max-width:640px){ #moon{width:74px;height:74px;top:4vh;} }

  /* minimal chrome */
  .wordmark{position:fixed;top:30px;left:34px;z-index:7;display:flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:3px;font-weight:600;color:var(--txt);}
  .wordmark svg{width:18px;height:18px;}
  .wordmark small{color:var(--sub);font-weight:400;}
  .tagline{position:fixed;left:0;right:0;bottom:8vh;z-index:7;text-align:center;padding:0 24px;}
  .tagline h1{font-size:clamp(22px,3.4vw,40px);font-weight:200;letter-spacing:1px;line-height:1.15;}
  .tagline h1 b{font-weight:600;
    background:linear-gradient(120deg,#d8c8ff,#b9a3ff 55%,#8367c8);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline p{margin-top:14px;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--sub);}
  .corner{position:fixed;bottom:26px;z-index:7;font-size:11px;letter-spacing:2px;color:var(--sub);}
  .corner.l{left:34px;} .corner.r{right:34px;}
  @media (max-width:640px){ .corner{display:none;} }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="topwash"></div>
<canvas id="robot"></canvas>
<div id="robotFallback"><img id="robotImg" alt="Wonder Byte"/></div>
<div class="vignette"></div>

<svg id="moon" viewBox="0 0 100 100" aria-label="crescent moon">
  <defs>
    <radialGradient id="mg" cx="40%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#d8c8ff"/>
      <stop offset="100%" stop-color="#8367c8"/>
    </radialGradient>
    <mask id="cres"><rect width="100" height="100" fill="black"/>
      <circle cx="50" cy="50" r="42" fill="white"/><circle cx="67" cy="41" r="38" fill="black"/></mask>
  </defs>
  <circle cx="50" cy="50" r="42" fill="url(#mg)" mask="url(#cres)"/>
</svg>

<div class="wordmark">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#b9a3ff"/><circle cx="66" cy="42" r="38" fill="#07060d"/></svg>
  WONDER&nbsp;ROBOTICS &nbsp;<small>· BYTE</small>
</div>

<div class="tagline">
  <h1>Connecting the <b>Artificial</b><br/>to the real world.</h1>
  <p>Queensland AI Hub · Brisbane</p>
</div>
<div class="corner l">EST. 2026</div>
<div class="corner r">◐ MOONLIT SERIES</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const ROBOT_GLB = 'https://d3u0tzju9qaucj.cloudfront.net/7d051b5a-7bfe-49fe-a484-24e7b3a9458a/c71510d0-e2ac-4bd4-b36d-f0a65bfe1142.glb';
const ROBOT_IMG = 'https://d8j0ntlcm91z4.cloudfront.net/user_3G6opfQVSzxLT3t56diiHpWmHPs/hf_20260722_071618_8ca92178-173c-4766-9f28-4039e79bccd8.png';
document.getElementById('robotImg').src = ROBOT_IMG;

/* ---- subtle starfield only (kept minimal & calm) ---- */
(function bg(){
  const canvas=document.getElementById('bg');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200); cam.position.z=30;
  const g=new THREE.BufferGeometry(), N=520, p=new Float32Array(N*3), a=new Float32Array(N);
  for(let i=0;i<N;i++){p[i*3]=(Math.random()-.5)*150;p[i*3+1]=(Math.random()-.5)*110;p[i*3+2]=(Math.random()-.5)*70-15;a[i]=Math.random();}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const stars=new THREE.Points(g,new THREE.PointsMaterial({color:0xcbb9ff,size:0.14,transparent:true,opacity:.7}));
  scene.add(stars);
  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
  let t=0;(function loop(){requestAnimationFrame(loop);t+=0.003;
    stars.rotation.y=t*0.06; stars.material.opacity=0.55+Math.sin(t*2)*0.12;
    renderer.render(scene,cam);})();
})();

/* ---- robot: clean, moonlit from above, small movements ---- */
(function robot(){
  const canvas=document.getElementById('robot');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.02;
  const scene=new THREE.Scene();
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.03).texture;
  const cam=new THREE.PerspectiveCamera(38,1,0.01,100); cam.position.set(0,0.9,4.2);

  // low ambient so the moon reads as the main light
  scene.add(new THREE.HemisphereLight(0x9f8fd0,0x120c22,0.35));
  // MOON key light from the top
  const moon=new THREE.DirectionalLight(0xd6c6ff,3.1); moon.position.set(0,7,2.5); scene.add(moon);
  // soft cool fill + violet rim for depth
  const fill=new THREE.DirectionalLight(0x8f7bd6,0.5); fill.position.set(-4,1,4); scene.add(fill);
  const rim=new THREE.DirectionalLight(0xb9a3ff,1.4); rim.position.set(2,3,-5); scene.add(rim);

  function size(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
    renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
  new ResizeObserver(size).observe(canvas); size();

  function fallback(){document.getElementById('robot').style.display='none';
    document.getElementById('robotFallback').style.display='flex';}

  let root=null, baseY=0; const clock=new THREE.Clock();
  new GLTFLoader().load(ROBOT_GLB,(gl)=>{
    root=gl.scene;
    const box=new THREE.Box3().setFromObject(root), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
    const md=Math.max(s.x,s.y,s.z)||1;
    root.position.sub(c); const b2=new THREE.Box3().setFromObject(root); root.position.y-=b2.min.y;
    baseY=root.position.y;
    cam.position.set(0, md*0.62, md*2.15); cam.lookAt(0, md*0.5, 0); cam.updateProjectionMatrix();
    scene.add(root);
  }, undefined, fallback);

  let mx=0,my=0; addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5);});
  (function loop(){requestAnimationFrame(loop);
    const t=clock.getElapsedTime();
    if(root){
      root.position.y = baseY + Math.sin(t*0.8)*0.035;          // gentle float
      root.rotation.y = Math.sin(t*0.32)*0.16 + mx*0.35;         // slow sway + subtle mouse parallax
      root.rotation.x = -my*0.06;
    }
    renderer.render(scene,cam);
  })();
})();
</script>
</body>
</html>
