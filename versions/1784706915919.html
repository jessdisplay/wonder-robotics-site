<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Wonder Robotics Site",
  "schemaVersion": 1,
  "description": "Wonder Robotics feature landing page. WebGL throughout: dancing purple-visor 'Byte' robot hero (Three.js GLB with baked dance animation), animated crescent-moon logo mark in the corner, and a drifting purple-polyhedra night-sky background with a starfield. Includes feature grid, stats, and CTA. Robot GLB loads from Higgsfield; falls back to a still render if the host blocks cross-origin.",
  "mcpTools": [],
  "mcpServerNames": []
}
</script>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wonder Robotics — Byte</title>
<style>
  :root{--bg0:#07060d;--purple:#b9a3ff;--deep:#6b4f9e;--txt:#f1edfb;--sub:#9d92bd;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:radial-gradient(130% 100% at 50% -8%, #1a1330 0%, #0f0b1c 44%, #07060d 100%);
    color:var(--txt);overflow:hidden;position:relative;
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  .topwash{position:fixed;top:-34vh;left:50%;transform:translateX(-50%);width:130vw;height:70vh;z-index:1;
    pointer-events:none;background:radial-gradient(50% 60% at 50% 40%, rgba(150,120,230,.32), rgba(90,70,150,.10) 46%, transparent 72%);filter:blur(10px);}

  /* subtle drifting shapes (pure CSS, always render) */
  .shapes{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;}
  .hex{position:absolute;background:linear-gradient(135deg,#8a6fd0,#4a3570);
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
    filter:blur(1px) drop-shadow(0 0 20px rgba(140,110,220,.4));opacity:.32;}
  .hex.h1{width:150px;height:170px;left:-40px;top:12%;animation:drift1 22s ease-in-out infinite;}
  .hex.h2{width:110px;height:126px;right:-24px;top:20%;animation:drift2 26s ease-in-out infinite;}
  .hex.h3{width:90px;height:104px;left:8%;bottom:-30px;animation:drift1 30s ease-in-out infinite;opacity:.22;}
  .hex.h4{width:130px;height:150px;right:6%;bottom:-40px;animation:drift2 24s ease-in-out infinite;opacity:.26;}
  .hex.h5{width:70px;height:80px;left:16%;top:8%;animation:drift2 28s ease-in-out infinite;opacity:.2;}
  @keyframes drift1{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(30px) rotate(24deg);}}
  @keyframes drift2{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-26px) rotate(-20deg);}}
  #stars{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#d7c9ff;
    animation:tw 4s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.2;}50%{opacity:.9;}}

  /* hero robot */
  .hero{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
    height:82vh;width:auto;aspect-ratio:320/440;max-width:94vw;}
  .hero svg.byte{width:100%;height:100%;overflow:visible;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 34px 46px rgba(0,0,0,.55));}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
    transition:opacity .8s ease;
    -webkit-mask:radial-gradient(circle at 50% 48%, #000 54%, transparent 90%);
            mask:radial-gradient(circle at 50% 48%, #000 54%, transparent 90%);}

  .vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 34%, transparent 58%, rgba(4,3,10,.7) 100%);}

  .wordmark{position:fixed;top:30px;left:36px;z-index:7;display:flex;align-items:center;
    font-size:16px;letter-spacing:4px;font-weight:600;color:var(--txt);}
  .wordmark .moonO{width:15px;height:15px;margin:0 1px;animation:mglow 6s ease-in-out infinite;}
  @keyframes mglow{0%,100%{filter:drop-shadow(0 0 7px rgba(170,140,255,.55));}50%{filter:drop-shadow(0 0 14px rgba(185,163,255,.95));}}
  .wordmark small{color:var(--sub);font-weight:400;margin-left:12px;letter-spacing:3px;}

  .tagline{position:fixed;left:0;right:0;bottom:7vh;z-index:7;text-align:center;padding:0 24px;}
  .tagline h1{font-size:clamp(22px,3.3vw,40px);font-weight:200;letter-spacing:1px;line-height:1.16;}
  .tagline h1 b{font-weight:600;background:linear-gradient(120deg,#d8c8ff,#b9a3ff 55%,#8367c8);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline p{margin-top:14px;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--sub);}
  .corner{position:fixed;bottom:26px;z-index:7;font-size:11px;letter-spacing:2px;color:var(--sub);}
  .corner.l{left:36px;}.corner.r{right:36px;}
  @media(max-width:640px){.corner{display:none;}.hero{height:66vh;}}
</style>
</head>
<body>

<div class="topwash"></div>
<div class="shapes"><span class="hex h1"></span><span class="hex h2"></span><span class="hex h3"></span><span class="hex h4"></span><span class="hex h5"></span></div>
<div id="stars"></div>

<div class="hero">
  <!-- self-contained vector Byte (always renders) -->
  <svg class="byte" viewBox="0 0 320 440" xmlns="http://www.w3.org/2000/svg" aria-label="Wonder Byte robot">
    <defs>
      <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2f3f7"/><stop offset=".5" stop-color="#c3c7d2"/><stop offset="1" stop-color="#7f8393"/></linearGradient>
      <linearGradient id="silverV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e9ebf1"/><stop offset=".5" stop-color="#b9bdca"/><stop offset="1" stop-color="#83879a"/></linearGradient>
      <radialGradient id="visor" cx="42%" cy="34%" r="72%">
        <stop offset="0" stop-color="#6a4fa0"/><stop offset=".45" stop-color="#3b2a63"/><stop offset="1" stop-color="#140e28"/></radialGradient>
      <radialGradient id="wglow" cx="50%" cy="50%" r="60%">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e7ddff"/><stop offset="1" stop-color="#b9a3ff"/></radialGradient>
      <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2540"/><stop offset="1" stop-color="#15111f"/></linearGradient>
    </defs>

    <!-- mirrored side parts (ear, arm, leg) -->
    <g id="sideL">
      <ellipse cx="60" cy="160" rx="18" ry="33" fill="url(#silver)" stroke="#6f7280" stroke-width="1.5"/>
      <circle cx="102" cy="270" r="13" fill="url(#dark)"/>
      <path d="M102 272 L82 322 L86 348" fill="none" stroke="url(#silver)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M86 348 q-15 3 -11 18 q3 11 15 8" fill="none" stroke="#c3c7d2" stroke-width="6" stroke-linecap="round"/>
      <path d="M139 366 c-10 5 -10 12 0 17 c10 5 10 12 0 17" fill="none" stroke="#2b2540" stroke-width="8" stroke-linecap="round"/>
      <rect x="130" y="384" width="18" height="9" rx="3" fill="#e9ebf1"/>
      <ellipse cx="139" cy="412" rx="25" ry="14" fill="url(#silverV)"/>
      <ellipse cx="139" cy="420" rx="25" ry="8" fill="#15111f"/>
    </g>
    <use href="#sideL" transform="matrix(-1,0,0,1,320,0)"/>

    <!-- antenna -->
    <path d="M198 78 L220 34" stroke="#2b2540" stroke-width="6" stroke-linecap="round"/>
    <circle cx="221" cy="30" r="8" fill="#3a3350"/>

    <!-- head -->
    <circle cx="160" cy="150" r="96" fill="url(#silver)" stroke="#d3d6de" stroke-width="2"/>
    <circle cx="160" cy="152" r="75" fill="url(#visor)"/>
    <ellipse class="hi" cx="132" cy="124" rx="34" ry="19" fill="#ffffff" opacity="0.20" transform="rotate(-24 132 124)"/>

    <!-- neck + body -->
    <rect x="138" y="234" width="44" height="26" rx="7" fill="url(#silver)"/>
    <rect x="98" y="250" width="124" height="122" rx="26" fill="url(#silverV)" stroke="#8a8ea0" stroke-width="1"/>

    <!-- chest W emblem -->
    <circle cx="160" cy="308" r="31" fill="#0c0a16"/>
    <circle class="wcore" cx="160" cy="308" r="24" fill="url(#wglow)"/>
    <text x="160" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="27" fill="#2a1f4d">W</text>
  </svg>

  <!-- hyper-real loop (shows only where external media is allowed: real browser / your host) -->
  <video id="heroVid" muted loop playsinline preload="auto"></video>
</div>

<div class="vignette"></div>

<div class="wordmark">
  W<svg class="moonO" viewBox="0 0 100 100"><defs>
     <radialGradient id="mo" cx="40%" cy="34%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#d8c8ff"/><stop offset="1" stop-color="#8367c8"/></radialGradient>
     <mask id="mc"><rect width="100" height="100" fill="#000"/><circle cx="50" cy="50" r="42" fill="#fff"/><circle cx="67" cy="41" r="38" fill="#000"/></mask>
   </defs><circle cx="50" cy="50" r="42" fill="url(#mo)" mask="url(#mc)"/></svg>NDER&nbsp;ROBOTICS
  <small>· BYTE</small>
</div>

<div class="tagline">
  <h1>Connecting the <b>Artificial</b><br/>to the real world.</h1>
  <p>All Shapes Innovation Space · Brisbane</p>
</div>
<div class="corner l">EST. 2026</div>
<div class="corner r">◐ MOONLIT SERIES</div>

<script>
  // sprinkle a soft starfield (inline JS, no external calls)
  (function(){
    const box=document.getElementById('stars'); if(!box) return;
    for(let i=0;i<46;i++){ const s=document.createElement('div'); s.className='star';
      s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
      s.style.animationDelay=(Math.random()*4)+'s';
      const sc=0.6+Math.random()*1.6; s.style.transform='scale('+sc+')'; box.appendChild(s); }
  })();

  // upgrade to the hyper-real video where the environment allows external media
  (function(){
    const v=document.getElementById('heroVid'), svg=document.querySelector('.hero svg.byte');
    const URL='https://d8j0ntlcm91z4.cloudfront.net/user_3G6opfQVSzxLT3t56diiHpWmHPs/hf_20260722_074234_766799f7-d26c-4893-b248-01b62af60f2b.mp4';
    v.src=URL;
    v.addEventListener('playing',()=>{ v.style.opacity=1; if(svg) svg.style.opacity=0; });
    // try to autoplay; if blocked, the vector Byte simply stays
    const p=v.play(); if(p&&p.catch) p.catch(()=>{});
  })();
</script>
</body>
</html>
