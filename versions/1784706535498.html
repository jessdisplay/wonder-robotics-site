<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wonder Robotics — Byte</title>
<style>
  :root{--bg0:#07060d;--purple:#b9a3ff;--deep:#6b4f9e;--txt:#f1edfb;--sub:#9d92bd;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg0);color:var(--txt);overflow:hidden;position:relative;
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;
    background:radial-gradient(130% 100% at 50% -8%, #1a1330 0%, #0f0b1c 44%, #07060d 100%);}
  .topwash{position:fixed;top:-34vh;left:50%;transform:translateX(-50%);width:130vw;height:70vh;z-index:1;
    pointer-events:none;background:radial-gradient(50% 60% at 50% 40%, rgba(150,120,230,.34), rgba(90,70,150,.10) 46%, transparent 72%);filter:blur(10px);}

  /* hyper-real robot video, edges feathered into the dark page */
  .hero{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
    height:92vh;aspect-ratio:1/1;max-width:96vw;}
  .hero video,.hero img{width:100%;height:100%;object-fit:cover;display:block;
    -webkit-mask:radial-gradient(circle at 50% 48%, #000 54%, transparent 90%);
            mask:radial-gradient(circle at 50% 48%, #000 54%, transparent 90%);}
  .hero img{display:none;}

  .vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 34%, transparent 56%, rgba(4,3,10,.72) 100%);}

  /* wordmark with the crescent moon as the "O" */
  .wordmark{position:fixed;top:30px;left:36px;z-index:7;display:flex;align-items:center;
    font-size:16px;letter-spacing:4px;font-weight:600;color:var(--txt);}
  .wordmark .moonO{width:15px;height:15px;margin:0 1px;filter:drop-shadow(0 0 8px rgba(170,140,255,.7));
    animation:glow 6s ease-in-out infinite;}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 7px rgba(170,140,255,.55));}
    50%{filter:drop-shadow(0 0 14px rgba(185,163,255,.95));}}
  .wordmark small{color:var(--sub);font-weight:400;margin-left:12px;letter-spacing:3px;}

  .tagline{position:fixed;left:0;right:0;bottom:7.5vh;z-index:7;text-align:center;padding:0 24px;}
  .tagline h1{font-size:clamp(22px,3.3vw,40px);font-weight:200;letter-spacing:1px;line-height:1.16;}
  .tagline h1 b{font-weight:600;background:linear-gradient(120deg,#d8c8ff,#b9a3ff 55%,#8367c8);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline p{margin-top:14px;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--sub);}
  .corner{position:fixed;bottom:26px;z-index:7;font-size:11px;letter-spacing:2px;color:var(--sub);}
  .corner.l{left:36px;} .corner.r{right:36px;}
  @media (max-width:640px){ .corner{display:none;} .hero{height:70vh;} }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="topwash"></div>

<div class="hero">
  <video id="heroVid" autoplay muted loop playsinline poster=""></video>
  <img id="heroImg" alt="Wonder Byte"/>
</div>

<div class="vignette"></div>

<div class="wordmark">
  W<svg class="moonO" viewBox="0 0 100 100"><defs>
     <radialGradient id="mo" cx="40%" cy="34%" r="78%"><stop offset="0%" stop-color="#fff"/><stop offset="45%" stop-color="#d8c8ff"/><stop offset="100%" stop-color="#8367c8"/></radialGradient>
     <mask id="mc"><rect width="100" height="100" fill="#000"/><circle cx="50" cy="50" r="42" fill="#fff"/><circle cx="67" cy="41" r="38" fill="#000"/></mask>
   </defs><circle cx="50" cy="50" r="42" fill="url(#mo)" mask="url(#mc)"/></svg>NDER&nbsp;ROBOTICS
  <small>· BYTE</small>
</div>

<div class="tagline">
  <h1>Connecting the <b>Artificial</b><br/>to the real world.</h1>
  <p>All Shapes Innovation Space · Brisbane</p>
</div>
<div class="corner l">EST. 2026</div>
<div class="corner r">◐ MOONLIT SERIES</div>

<script>
  // hyper-real robot: looping video, with still-image fallback
  const VIDEO_URL='https://d8j0ntlcm91z4.cloudfront.net/user_3G6opfQVSzxLT3t56diiHpWmHPs/hf_20260722_074234_766799f7-d26c-4893-b248-01b62af60f2b.mp4';
  const DARK_IMG='https://d8j0ntlcm91z4.cloudfront.net/user_3G6opfQVSzxLT3t56diiHpWmHPs/hf_20260722_074021_f12800de-7a56-4e4f-879d-992a31959998.png';
  const v=document.getElementById('heroVid'), img=document.getElementById('heroImg');
  img.src=DARK_IMG;
  function useImg(){ v.style.display='none'; img.style.display='block'; }
  if(!VIDEO_URL || VIDEO_URL.indexOf('__')===0){ useImg(); }
  else { v.src=VIDEO_URL; v.addEventListener('error',useImg); }
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// subtle drifting purple shapes + faint stars
(function bg(){
  const canvas=document.getElementById('bg');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
  const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x0f0b1c,0.035);
  const cam=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,200); cam.position.z=26;
  const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.05).texture;
  scene.add(new THREE.AmbientLight(0x8a7ac0,0.5));
  const d=new THREE.DirectionalLight(0xc9b6ff,1.2); d.position.set(4,7,9); scene.add(d);
  // stars
  const g=new THREE.BufferGeometry(),N=460,p=new Float32Array(N*3);
  for(let i=0;i<N;i++){p[i*3]=(Math.random()-.5)*150;p[i*3+1]=(Math.random()-.5)*110;p[i*3+2]=(Math.random()-.5)*60-15;}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const stars=new THREE.Points(g,new THREE.PointsMaterial({color:0xcbb9ff,size:0.13,transparent:true,opacity:.6}));
  scene.add(stars);
  // a few subtle polyhedra, kept to the edges so they don't fight the robot
  const mat=new THREE.MeshStandardMaterial({color:0x7c5cc4,metalness:.5,roughness:.22});
  const geos=[new THREE.IcosahedronGeometry(1,0),new THREE.DodecahedronGeometry(1,0),new THREE.OctahedronGeometry(1,0)];
  const shapes=[];
  const spots=[[-20,9],[22,12],[-24,-10],[24,-8],[-14,16],[17,-16]];
  spots.forEach((s,i)=>{const m=new THREE.Mesh(geos[i%geos.length],mat.clone());
    const sc=1.2+Math.random()*1.8; m.scale.setScalar(sc);
    m.position.set(s[0],s[1],-6-Math.random()*8);
    m.userData={rx:(Math.random()-.5)*0.003,ry:(Math.random()-.5)*0.003,f:0.15+Math.random()*0.3,ph:Math.random()*6.28,base:s[1]};
    scene.add(m); shapes.push(m);});
  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
  let mx=0,my=0; addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});
  let t=0;(function loop(){requestAnimationFrame(loop);t+=0.004;
    shapes.forEach(m=>{m.rotation.x+=m.userData.rx;m.rotation.y+=m.userData.ry;
      m.position.y=m.userData.base+Math.sin(t*m.userData.f+m.userData.ph)*1.1;});
    stars.rotation.y=t*0.05;
    cam.position.x+=(mx*3-cam.position.x)*0.03; cam.position.y+=(-my*2-cam.position.y)*0.03; cam.lookAt(0,0,0);
    renderer.render(scene,cam);})();
})();
</script>
</body>
</html>
